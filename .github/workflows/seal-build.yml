name: seal-build

# Upstream LatencyUtils ships no CI. This workflow reproduces the release build:
# Maven 3.2.3 on JDK 8 (published jar: Created-By Apache Maven 3.2.3,
# Build-Jdk 1.8.0_45, class files target 1.6 per pom.xml), running the
# project's JUnit suite via surefire during `mvn package`.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Cache Maven 3.2.3
        id: mvn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apache-maven-3.2.3
          key: apache-maven-3.2.3

      - name: Install Maven 3.2.3
        if: steps.mvn-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.2.3/binaries/apache-maven-3.2.3-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"

      - name: Put Maven 3.2.3 on PATH
        run: |
          echo "$RUNNER_TEMP/apache-maven-3.2.3/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Build and test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            mvn -B clean package -Dmaven.javadoc.skip=true -Dtest="$TEST_FILTER" -DfailIfNoTests=false
          else
            mvn -B clean package -Dmaven.javadoc.skip=true
          fi

      - name: Surefire per-suite results
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && cat "$f"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: LatencyUtils-jar
          path: target/LatencyUtils-2.0.3.jar
          if-no-files-found: error
